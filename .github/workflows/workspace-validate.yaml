# Dry-run validation of ElasticClaw workspaces on PRs.
# Requires repo secret: ELASTICCLAW_TOKEN

name: Validate Workspaces

on:
  pull_request:
    paths:
      - ".elasticclaw/workspace/schemahero"
      - ".github/workflows/workspace-validate.yaml"
      - ".github/workflows/workspace-publish.yaml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        workspace:
          - schemahero
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workspace
        uses: elasticclaw/actions/publish-workspace@main
        with:
          hub-endpoint: https://factory.repldev.com
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: ${{ matrix.workspace }}
          dry-run: true
