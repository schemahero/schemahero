# Publishes ElasticClaw workspaces to factory.repldev.com from main.
# Requires repo secret: ELASTICCLAW_TOKEN

name: Publish Workspaces

on:
  push:
    branches:
      - main
    paths:
      - ".elasticclaw/workspace/schemahero"
      - ".github/workflows/workspace-validate.yaml"
      - ".github/workflows/workspace-publish.yaml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        workspace:
          - schemahero
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish workspace
        uses: elasticclaw/actions/publish-workspace@main
        with:
          hub-endpoint: https://factory.repldev.com
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          path: ${{ matrix.workspace }}
