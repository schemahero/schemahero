name: Publish ElasticClaw Workflow

on:
  push:
    branches:
      - main
    paths:
      - ".elasticclaw/workflows/schemahero-go-updates.yaml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish workflow (${{ matrix.workflow }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - .elasticclaw/workflows/schemahero-go-updates.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish workflow (schemahero-go-updates)
        uses: elasticclaw/actions/publish-workflow@main
        with:
          hub-endpoint: https://factory.repldev.com
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          workspace: schemahero
          path: ${{ matrix.workflow }}
