name: Validate ElasticClaw Workflow

on:
  pull_request:
    paths:
      - ".elasticclaw/workflows/schemahero-go-updates.yaml"

jobs:
  validate:
    name: Validate workflow (${{ matrix.workflow }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - .elasticclaw/workflows/schemahero-go-updates.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workflow (schemahero-go-updates)
        uses: elasticclaw/actions/publish-workflow@main
        with:
          hub-endpoint: https://factory.repldev.com
          token: ${{ secrets.ELASTICCLAW_TOKEN }}
          workspace: schemahero
          path: ${{ matrix.workflow }}
          dry-run: true
