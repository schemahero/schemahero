name: "Tagged release"
on:
  push:
    tags: ["*"]

env:
  REGISTRY: docker.io
  REGISTRY_NAMESPACE: schemahero

jobs:
  # Determine which plugins changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.filter.outputs.postgres }}
      mysql: ${{ steps.filter.outputs.mysql }}
      timescaledb: ${{ steps.filter.outputs.timescaledb }}
      sqlite: ${{ steps.filter.outputs.sqlite }}
      rqlite: ${{ steps.filter.outputs.rqlite }}
      cassandra: ${{ steps.filter.outputs.cassandra }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            postgres:
              - 'plugins/postgres/**'
              - '.github/workflows/tagged-release.yaml'
            mysql:
              - 'plugins/mysql/**'
              - '.github/workflows/tagged-release.yaml'
            timescaledb:
              - 'plugins/timescaledb/**'
              - '.github/workflows/tagged-release.yaml'
            sqlite:
              - 'plugins/sqlite/**'
              - '.github/workflows/tagged-release.yaml'
            rqlite:
              - 'plugins/rqlite/**'
              - '.github/workflows/tagged-release.yaml'
            cassandra:
              - 'plugins/cassandra/**'
              - '.github/workflows/tagged-release.yaml'

  # PostgreSQL Plugin
  build-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/postgres/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/postgres/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: postgres
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true

  # MySQL Plugin
  build-mysql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/mysql/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/mysql/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: mysql
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true

  # TimescaleDB Plugin
  build-timescaledb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/timescaledb/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/timescaledb/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: timescaledb
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true

  # SQLite Plugin
  build-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/sqlite/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/sqlite/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: sqlite
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true

  # RQLite Plugin
  build-rqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/rqlite/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/rqlite/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: rqlite
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true

  # Cassandra Plugin
  build-cassandra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get plugin version
        id: version
        run: echo "VERSION=$(cat plugins/cassandra/VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: plugins/cassandra/go.sum

      - name: Build and push
        uses: ./.github/actions/build-plugin
        with:
          plugin_name: cassandra
          plugin_version: ${{ steps.version.outputs.VERSION }}
          platforms: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
          registry: ${{ env.REGISTRY }}
          registry_namespace: ${{ env.REGISTRY_NAMESPACE }}
          dockerhub_username: schemahero
          dockerhub_token: ${{ secrets.DOCKER_OAT }}
          push: true
  build:
    runs-on: ubuntu-latest
    needs: [build-postgres, build-mysql, build-timescaledb, build-sqlite, build-rqlite, build-cassandra]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: ./go.sum

      - run: make fmt
      - run: go mod tidy
      - run: git diff
      - run: make vet manifests bin/kubectl-schemahero manager test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manager
          path: bin/manager
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubectl-schemahero
          path: bin/kubectl-schemahero

  test-postgres:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        postgres_version: ["14.20", "15.15", "16.11", "17.7", "18.1"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build postgres plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/postgres
          go build -o $HOME/.schemahero/plugins/schemahero-postgres .
          chmod +x $HOME/.schemahero/plugins/schemahero-postgres
      - run: make -C integration/tests/postgres ${{matrix.postgres_version}}

  test-mysql:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        mysql_version: ["8.0.45", "8.4.8", "9.5.2"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build mysql plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/mysql
          go build -o $HOME/.schemahero/plugins/schemahero-mysql .
          chmod +x $HOME/.schemahero/plugins/schemahero-mysql
      - run: make -C integration/tests/mysql ${{matrix.mysql_version}}

  test-cockroach:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        cockroachdb_version: ["v24.3.25", "v25.2.11", "v25.4.3"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build postgres plugin (cockroach uses postgres plugin)
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/postgres
          go build -o $HOME/.schemahero/plugins/schemahero-postgres .
          chmod +x $HOME/.schemahero/plugins/schemahero-postgres
      - run: make -C integration/tests/cockroach ${{matrix.cockroachdb_version}}

  test-cassandra:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        cassandra_version: ["4.0.19", "4.1.10", "5.0.6"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build cassandra plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/cassandra
          go build -o $HOME/.schemahero/plugins/schemahero-cassandra .
          chmod +x $HOME/.schemahero/plugins/schemahero-cassandra
      - run: make -C integration/tests/cassandra ${{matrix.cassandra_version}}

  test-sqlite:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        sqlite_version: ["3.51.2"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build sqlite plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/sqlite
          go build -o $HOME/.schemahero/plugins/schemahero-sqlite .
          chmod +x $HOME/.schemahero/plugins/schemahero-sqlite
      - run: make -C integration/tests/sqlite ${{matrix.sqlite_version}}

  test-rqlite:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        rqlite_version: ["8.36.8", "9.3.18"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build rqlite plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/rqlite
          go build -o $HOME/.schemahero/plugins/schemahero-rqlite .
          chmod +x $HOME/.schemahero/plugins/schemahero-rqlite
      - run: make -C integration/tests/rqlite ${{matrix.rqlite_version}}

  test-timescaledb:
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    strategy:
      matrix:
        timescaledb_version: ["2.25.0-pg17"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
      - name: Download kubectl-schemahero binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kubectl-schemahero
          path: bin/
      - run: chmod +x bin/kubectl-schemahero
      - name: Build timescaledb plugin
        run: |
          mkdir -p $HOME/.schemahero/plugins
          cd plugins/timescaledb
          go build -o $HOME/.schemahero/plugins/schemahero-timescaledb .
          chmod +x $HOME/.schemahero/plugins/schemahero-timescaledb
      - run: make -C integration/tests/timescaledb ${{matrix.timescaledb_version}}

  build-docker-manager:
    runs-on: ubuntu-latest
    needs:
      - test-postgres
      - test-mysql
      - test-cockroach
      - test-cassandra
      - test-sqlite
      - test-rqlite
      - test-timescaledb
    if: always() && !cancelled()
    outputs:
      digest: ${{ steps.release-manager.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: schemaherodeploy
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Docker meta for manager
        id: meta-manager
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: index.docker.io/schemahero/schemahero-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.get_version.outputs.prerelease == '' }}
      - name: Build and push
        id: release-manager
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          target: manager
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-manager.outputs.tags }}
          labels: ${{ steps.meta-manager.outputs.labels }}

  build-docker-schemahero:
    runs-on: ubuntu-latest
    needs:
      - test-postgres
      - test-mysql
      - test-cockroach
      - test-cassandra
      - test-sqlite
      - test-rqlite
      - test-timescaledb
    if: always() && !cancelled()
    outputs:
      digest: ${{ steps.release-schemahero.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: schemaherodeploy
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta for schemahero
        id: meta-schemahero
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: index.docker.io/schemahero/schemahero
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.get_version.outputs.prerelease == '' }}
      - name: Build and push
        id: release-schemahero
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          target: schemahero
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-schemahero.outputs.tags }}
          labels: ${{ steps.meta-schemahero.outputs.labels }}

  build-docker-slack-app:
    runs-on: ubuntu-latest
    needs:
      - test-postgres
      - test-mysql
      - test-cockroach
      - test-cassandra
      - test-sqlite
      - test-rqlite
      - test-timescaledb
    if: always() && !cancelled()
    outputs:
      digest: ${{ steps.release-slack-app.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: schemaherodeploy
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker meta for slack app
        id: meta-slack-app
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9
        with:
          images: index.docker.io/schemahero/slack-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.get_version.outputs.prerelease == '' }}
      - name: Build and push
        id: release-slack-app
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          target: slack-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-slack-app.outputs.tags }}
          labels: ${{ steps.meta-slack-app.outputs.labels }}

  github-release-tarballs:
    runs-on: ubuntu-latest
    needs:
      - test-postgres
      - test-mysql
      - test-cockroach
      - test-cassandra
      - test-sqlite
      - test-rqlite
      - test-timescaledb
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: ./go.sum

      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5

      - id: get_prerelease_flag
        env:
          PRERELEASE: ${{ steps.get_version.outputs.prerelease }}
        run: |
          if [ -z $PRERELEASE ]; then
            echo "::set-output name=prerelease::false"
          else
            echo "::set-output name=prerelease::true"
          fi

      - name: make release-tarballs
        run: make release-tarballs VERSION=${{ steps.get_version.outputs.version-without-v }}
        env:
          GIT_TAG: ${{ steps.get_version.outputs.version-without-v }}

      - name: create github release
        id: create-github-release
        uses: Hs1r1us/Release-AIO@354b8db50d5b6310b621cb6c5e29d1f8e611aff7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ github.ref }}
          asset_files: './release'
          prerelease: ${{ steps.get_prerelease_flag.outputs.prerelease }}

  krew:
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')
    runs-on: ubuntu-latest
    needs:
      - github-release-tarballs
      - build-docker-schemahero
      - build-docker-manager
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Create new schemahero version in krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3
        with:
          krew_template_file: deploy/krew.yaml

  homebrew:
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')
    runs-on: ubuntu-latest
    needs:
      - github-release-tarballs
    steps:
      - id: get_version
        uses: battila7/get-version-action@d97fbc34ceb64d1f5d95f4dfd6dce33521ccccf5
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: schemahero/homebrew-tap
          event-type: release
          client-payload: '{"version": "${{ steps.get_version.outputs.version-without-v }}"}'
